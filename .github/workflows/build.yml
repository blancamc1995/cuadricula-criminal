name: Publicar y crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  todo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.web.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir la app
        run: unzip -o cuadricula-criminal-github.zip -d build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: web
        uses: actions/deploy-pages@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar el APK
        working-directory: build/android
        run: gradle assembleRelease --no-daemon

      - name: Guardar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Cuadrícula Criminal ${{ github.run_number }}
          files: build/android/app/build/outputs/apk/release/app-release.apk
